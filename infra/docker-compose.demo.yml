x-api-common: &api-common
  image: hawk-api-demo:local
  build:
    context: ${HAWK_BUILD_CONTEXT:-..}
    dockerfile: infra/Dockerfile.api
  env_file:
    - ${HAWK_APP_ENV_FILE:-../.env}
  environment: &api-environment
    PYTHONPATH: /workspace/apps/api
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-aicontrol}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:3001}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3001,http://localhost:3001}
    API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:8000}
    DEPLOYMENT_ID: ${DEPLOYMENT_ID:-local-development}
    DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:-local-development}
    DEPLOYMENT_DATA_LOCATION: ${DEPLOYMENT_DATA_LOCATION:-local-development}
    DEPLOYMENT_TOPOLOGY: ${DEPLOYMENT_TOPOLOGY:-development}
    COMPONENT_VERSION: ${COMPONENT_VERSION:-0.1.0}
    COMPONENT_PROTOCOL_VERSION: ${COMPONENT_PROTOCOL_VERSION:-1.0}
    MINIMUM_COMPONENT_VERSIONS_JSON: ${MINIMUM_COMPONENT_VERSIONS_JSON:-{"api":"0.1.0","worker":"0.1.0","celery_beat":"0.1.0","web":"0.1.0"}}
    CONTROL_PLANE_HEARTBEAT_MAX_AGE_SECONDS: ${CONTROL_PLANE_HEARTBEAT_MAX_AGE_SECONDS:-45}
  networks:
    - hawk-demo

# Compose extension field documenting the restart-readiness invariant enforced
# by check_component_heartbeat.py and the configured maximum age above.
x-recovery-contract: heartbeat_is_fresh

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - hawk_demo_postgres_data:/var/lib/postgresql/data
    networks:
      - hawk-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - hawk-demo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    <<: *api-common
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *api-environment
      COMPONENT_TYPE: api
    command: ["python", "/workspace/infra/scripts/run_migrations.py"]

  seed-demo:
    <<: *api-common
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      COMPONENT_TYPE: api
    command: ["python", "/workspace/infra/scripts/seed.py"]

  api:
    <<: *api-common
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-demo:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HAWK_API_HOST_PORT:-8000}:8000"
    environment:
      <<: *api-environment
      COMPONENT_TYPE: api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./artifacts:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  worker:
    <<: *api-common
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      <<: *api-environment
      COMPONENT_TYPE: worker
    command: ["celery", "-A", "app.jobs.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency", "${CELERY_WORKER_CONCURRENCY:-4}", "--prefetch-multiplier", "1", "-Q", "default,monitoring,auditor,discovery"]
    volumes:
      - ./artifacts:/artifacts
    healthcheck:
      test: ["CMD", "python", "/workspace/infra/scripts/check_component_heartbeat.py", "worker"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  celery-beat:
    <<: *api-common
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      <<: *api-environment
      COMPONENT_TYPE: celery_beat
    command: ["celery", "-A", "app.jobs.celery_app.celery_app", "beat", "--loglevel=info"]
    volumes:
      - ./artifacts:/artifacts
    healthcheck:
      test: ["CMD", "python", "/workspace/infra/scripts/check_component_heartbeat.py", "celery_beat"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  web:
    image: hawk-web-demo:local
    build:
      context: ${HAWK_BUILD_CONTEXT:-..}
      dockerfile: infra/Dockerfile.web.demo
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_CONTROL_COVERAGE_UI_ENABLED: ${NEXT_PUBLIC_CONTROL_COVERAGE_UI_ENABLED:-true}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
      NEXT_PUBLIC_CONTROL_COVERAGE_UI_ENABLED: ${NEXT_PUBLIC_CONTROL_COVERAGE_UI_ENABLED:-true}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HAWK_WEB_HOST_PORT:-3001}:3000"
    networks:
      - hawk-demo
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  hawk-demo:
    # Keep the local demo stack isolated from production deployments that may
    # already own the historical hawk_demo_network name.
    name: ${HAWK_NETWORK_NAME:-hawk_demo_local_network}

volumes:
  hawk_demo_postgres_data:
    name: ${HAWK_POSTGRES_VOLUME_NAME:-hawk_demo_postgres_data}
  hawk_demo_redis_data:
    name: ${HAWK_REDIS_VOLUME_NAME:-hawk_demo_redis_data}
