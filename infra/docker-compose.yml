services:
  db:
    image: postgres:16
    container_name: ai_control_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aicontrol}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aicontrol}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7
    container_name: ai_control_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate-seed:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: ai_control_migrate_seed
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bash", "-lc", "PYTHONPATH=/workspace/apps/api alembic -c app/db/migrations/alembic.ini upgrade head && PYTHONPATH=/workspace/apps/api python /workspace/infra/scripts/seed.py"]
    restart: "no"
    volumes:
      - ../apps/api:/workspace/apps/api
      - ../packages:/workspace/packages
      - ../infra/scripts:/workspace/infra/scripts

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: ai_control_api
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-seed:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: ["bash", "-lc", "uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - ../apps/api:/workspace/apps/api
      - ../packages:/workspace/packages
      - ../infra/scripts:/workspace/infra/scripts
      - ./artifacts:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: ai_control_worker
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-seed:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command: ["bash", "-lc", "celery -A app.jobs.celery_app.celery_app worker --loglevel=info -Q default,monitoring,auditor,discovery"]
    volumes:
      - ../apps/api:/workspace/apps/api
      - ../packages:/workspace/packages
      - ./artifacts:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys; from redis import Redis; r=Redis.from_url(os.getenv('REDIS_URL','redis://redis:6379/0')); sys.exit(0 if r.get('control_plane:celery:worker_heartbeat') else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  celery-beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: ai_control_celery_beat
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-seed:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command: ["bash", "-lc", "celery -A app.jobs.celery_app.celery_app beat --loglevel=info"]
    volumes:
      - ../apps/api:/workspace/apps/api
      - ../packages:/workspace/packages
      - ./artifacts:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys; from redis import Redis; r=Redis.from_url(os.getenv('REDIS_URL','redis://redis:6379/0')); sys.exit(0 if r.get('control_plane:celery:beat_heartbeat') else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: ai_control_web
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: https://hawk.localhost:3443/api
      WEB_ORIGIN: https://hawk.localhost:3443
      FRONTEND_URL: https://hawk.localhost:3443
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: ["sh", "-lc", "npm run dev:webpack -- --hostname 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
