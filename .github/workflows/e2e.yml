name: Browser end-to-end tests

# The console in a real browser (Chromium, Playwright) against the real API: a fresh installation on SQLite whose first
# administrator is made at start (FIRST_RUN_ACCESS, ADMIN_EMAIL, ADMIN_PASSWORD), the production console build, and a
# small proxy putting both on one origin, /api to the API, as deploy/compose.yaml's front proxy does
# (apps/web/playwright.config.ts, apps/web/e2e/harness/). Sign-in, the session cookies and CSRF, first run, Settings.

on:
  # Pull requests only: pushes to main run this through release.yml, so it never runs twice for one commit.
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
  # Called by release.yml: nothing is published unless these pass.
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: Console in Chromium against the API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the API's dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Install the console's dependencies from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the console for one origin (API at /api)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: node e2e/harness/web_server.mjs --build-only

      - name: Run the browser tests
        env:
          E2E_SKIP_BUILD: "1"
          E2E_PYTHON: python
          E2E_STATE_DIR: ${{ runner.temp }}/hawk-e2e
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx playwright test

      - name: Upload the report, traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
