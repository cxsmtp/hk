name: Release images

# Ported from CxMissionZero's .github/workflows/container.yml, for Hawk AI's several images. On every push to main (or
# master) and every version tag, once the API tests, the console's checks and the image smoke test have passed, it
# builds every image deploy/compose.yaml runs, for linux/amd64 and linux/arm64, and publishes them to the GitHub
# container registry:
#   ghcr.io/<owner>/<repo>-api, -web, -proxy, -updater   :latest and :<version> (from main), :sha-<commit>, :<semver> (tags)
# Each image carries the list of the files it ships, with their SHA-256 (integrity.json, written by its Dockerfile's
# integrity stage). The list is read from the amd64 and the arm64 image and must be the same; then the list and the
# image are signed with a GitHub build attestation (Sigstore, public log). Hawk AI checks its own files and that
# signature, and the updater checks a new version's before installing it (docs/integrity.md, docs/updating.md).
# `stable` is moved by hand only, with promote-stable.yml.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; only publishing may write packages and sign.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every API test and the console's checks: nothing is published unless they pass.
  api-tests:
    uses: ./.github/workflows/api-tests.yml
  component-tests:
    uses: ./.github/workflows/component-tests.yml

  # Each image builds, and its file list matches what is in it (as CxMissionZero's smoke test checks its list).
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, dockerfile: infra/Dockerfile.api, target: runtime, root: /workspace, check: 'python /workspace/infra/scripts/integrity.py check /workspace' }
          - { image: web, dockerfile: infra/Dockerfile.web, target: runtime, root: /workspace, check: '' }
          - { image: proxy, dockerfile: infra/Dockerfile.proxy, target: runtime, root: /, check: '' }
          - { image: updater, dockerfile: infra/Dockerfile.updater, target: runtime, root: /app, check: '' }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build
        run: docker build --file "${{ matrix.dockerfile }}" --target "${{ matrix.target }}" --build-arg HAWK_COMMIT=${{ github.sha }} --build-arg HAWK_REPOSITORY=${{ github.repository }} -t "hawk-${{ matrix.image }}:test" .
      - name: The file list matches the image
        env:
          IMAGE: hawk-${{ matrix.image }}:test
          ROOT: ${{ matrix.root }}
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          id=$(docker create "$IMAGE")
          docker cp "$id:${ROOT%/}/integrity.json" integrity.json
          docker rm "$id" > /dev/null
          grep -q '"repository": "${{ github.repository }}"' integrity.json
          grep -q '"image": "${{ matrix.image }}"' integrity.json
          grep -q "\"version\": \"$(cat VERSION)\"" integrity.json
          if [ -n "$CHECK" ]; then docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint sh "$IMAGE" -c "$CHECK"; fi

  publish:
    needs: [api-tests, component-tests, smoke-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          # same: the list must be byte for byte the same on both platforms (it holds no platform's own binary).
          # The proxy's list is of the Caddy binary, built for each platform: each platform's list is signed instead.
          - { image: api, dockerfile: infra/Dockerfile.api, target: runtime, manifest: /workspace/integrity.json, same: true }
          - { image: web, dockerfile: infra/Dockerfile.web, target: runtime, manifest: /workspace/integrity.json, same: true }
          - { image: proxy, dockerfile: infra/Dockerfile.proxy, target: runtime, manifest: /integrity.json, same: false }
          - { image: updater, dockerfile: infra/Dockerfile.updater, target: runtime, manifest: /app/integrity.json, same: true }
    permissions:
      contents: read
      packages: write
      # Signing: the file list and the image get a GitHub build attestation (Sigstore, public log).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version in VERSION (shown as HK-xx.xx.xx): a tag per release, for Settings → Updates to list and roll back to.
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.name.outputs.image }}
          # main / master publish :latest and :<version>, whichever branch is the repository's default.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            HAWK_COMMIT=${{ github.sha }}
            HAWK_REPOSITORY=${{ github.repository }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # The file list each image is checked against: read from each platform's image, compared, then signed.
      - name: The file list, from amd64 and arm64
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MANIFEST: ${{ matrix.manifest }}
          SAME: ${{ matrix.same }}
        run: |
          set -euo pipefail
          # Each platform's own image (by its manifest digest): docker keeps one platform of an index at a time.
          index=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          for arch in amd64 arm64; do
            digest=$(echo "$index" | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            test -n "$digest"
            id=$(docker create --platform "linux/$arch" "$IMAGE@$digest")
            docker cp "$id:$MANIFEST" "integrity-$arch.json"
            docker rm "$id" > /dev/null
          done
          if [ "$SAME" = true ]; then
            cmp integrity-amd64.json integrity-arm64.json
            cp integrity-amd64.json integrity.json
            rm integrity-amd64.json integrity-arm64.json
          fi
          sha256sum integrity*.json
      - name: Sign the file list
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.same && 'integrity.json' || 'integrity-*.json' }}
      - name: Sign the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
