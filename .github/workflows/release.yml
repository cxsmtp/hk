name: Release images

# Ported from CxMissionZero's .github/workflows/container.yml, for Hawk AI's several images. On every push to main (or
# master) and every version tag, once the API tests, the console's checks, the browser tests and the image smoke test
# have passed, it builds every image deploy/compose.yaml runs, for linux/amd64 and linux/arm64, and publishes them to
# the GitHub container registry:
#   ghcr.io/<owner>/<repo>-api, -web, -proxy, -updater   :latest and :<version> (from main), :sha-<commit>, :<semver> (tags)
# Each image carries the list of the files it ships, with their SHA-256 (integrity.json, written by its Dockerfile's
# integrity stage). The list is read from the amd64 and the arm64 image and must be the same; then the list and the
# image are signed with a GitHub build attestation (Sigstore, public log). Hawk AI checks its own files and that
# signature, and the updater checks a new version's before installing it (/settings/guide/updates, /settings/guide/updates).
# `stable` is moved by hand only, with promote-stable.yml.
#
# Software bill of materials (NIST SSDF PS.3.2, SBOM): every published image gets a CycloneDX SBOM for amd64 and for
# arm64 (syft, pinned and checksum-verified), and the API's Python dependencies (apps/api/requirements.lock) and the
# console's npm dependencies (apps/web/package-lock.json, the packages that ship) get one each. Each SBOM is signed with
# a GitHub SBOM attestation (Sigstore, public log) bound to the image's digest or to the lock file it describes, kept
# with the image in the registry, uploaded with the run, and attached to the GitHub release of a version tag. An SBOM
# lists packages and their versions only: no file contents (and the images carry no secrets: .dockerignore), and a
# secret scan of every SBOM must pass before it is published.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; only publishing may write packages and sign.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every API test, the console's checks and its browser tests: nothing is published unless they pass.
  # On a pull request these already run from api-tests.yml, component-tests.yml and e2e.yml themselves.
  api-tests:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/api-tests.yml
  component-tests:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/component-tests.yml
  e2e-tests:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/e2e.yml

  # The Python and npm dependencies, as CycloneDX SBOMs. On a pull request they are only made and checked.
  dependency-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SYFT_CHECK_FOR_APP_UPDATE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install syft (checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o syft.tgz https://github.com/anchore/syft/releases/download/v1.32.0/syft_1.32.0_linux_amd64.tar.gz
          echo "d6400b579fa84dd383573b1d1ff6f081a37fc64d3ffaafdfdda95c4325f204be  syft.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf syft.tgz -C "$RUNNER_TEMP/bin" syft && rm syft.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks && rm gitleaks.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: SBOMs of the API's Python and the console's npm dependencies
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          mkdir -p sbom "$RUNNER_TEMP/src/python" "$RUNNER_TEMP/src/npm"
          # syft reads pinned Python requirements from a requirements*.txt name; the lock is exactly that format.
          cp apps/api/requirements.lock "$RUNNER_TEMP/src/python/requirements.txt"
          cp apps/web/package.json apps/web/package-lock.json "$RUNNER_TEMP/src/npm/"
          syft scan "dir:$RUNNER_TEMP/src/python" --source-name hawk-api-python --source-version "$version" -o "cyclonedx-json=sbom/hawk-api-python.cdx.json"
          syft scan "dir:$RUNNER_TEMP/src/npm" --source-name hawk-web-npm --source-version "$version" -o "cyclonedx-json=sbom/hawk-web-npm.cdx.json"
          for f in sbom/*.cdx.json; do
            test "$(jq -r .bomFormat "$f")" = CycloneDX
            test "$(jq '.components | length' "$f")" -gt 10
          done
      - name: The SBOMs carry no secret
        run: gitleaks dir sbom --no-banner --redact --verbose
      - name: Sign the Python SBOM (bound to apps/api/requirements.lock)
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: apps/api/requirements.lock
          sbom-path: sbom/hawk-api-python.cdx.json
      - name: Sign the npm SBOM (bound to apps/web/package-lock.json)
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: apps/web/package-lock.json
          sbom-path: sbom/hawk-web-npm.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-dependencies
          path: sbom/
          retention-days: 90

  # Each image builds, and its file list matches what is in it (as CxMissionZero's smoke test checks its list).
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, dockerfile: infra/Dockerfile.api, target: runtime, root: /workspace, check: 'python /workspace/infra/scripts/integrity.py check /workspace' }
          - { image: web, dockerfile: infra/Dockerfile.web, target: runtime, root: /workspace, check: '' }
          - { image: proxy, dockerfile: infra/Dockerfile.proxy, target: runtime, root: /, check: '' }
          - { image: updater, dockerfile: infra/Dockerfile.updater, target: runtime, root: /app, check: '' }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build
        run: docker build --file "${{ matrix.dockerfile }}" --target "${{ matrix.target }}" --build-arg HAWK_COMMIT=${{ github.sha }} --build-arg HAWK_REPOSITORY=${{ github.repository }} -t "hawk-${{ matrix.image }}:test" .
      - name: The file list matches the image
        env:
          IMAGE: hawk-${{ matrix.image }}:test
          ROOT: ${{ matrix.root }}
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          id=$(docker create "$IMAGE")
          docker cp "$id:${ROOT%/}/integrity.json" integrity.json
          docker rm "$id" > /dev/null
          grep -q '"repository": "${{ github.repository }}"' integrity.json
          grep -q '"image": "${{ matrix.image }}"' integrity.json
          grep -q "\"version\": \"$(cat VERSION)\"" integrity.json
          if [ -n "$CHECK" ]; then docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint sh "$IMAGE" -c "$CHECK"; fi
      - name: Install grype (checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o grype.tgz https://github.com/anchore/grype/releases/download/v0.99.1/grype_0.99.1_linux_amd64.tar.gz
          echo "7fde4d45fe097daa2554078cd9e81faa43e51266a888337f5446c1ffc42d451f  grype.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf grype.tgz -C "$RUNNER_TEMP/bin" grype && rm grype.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Nothing is published with a known vulnerability rated High or Critical that has a fix (.grype.yaml lists the
      # few reasoned exceptions).
      - name: The image has no fixable High or Critical vulnerability
        env:
          IMAGE: hawk-${{ matrix.image }}:test
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: grype "docker:$IMAGE" --config .grype.yaml

  publish:
    needs: [api-tests, component-tests, e2e-tests, smoke-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          # same: the list must be byte for byte the same on both platforms (it holds no platform's own binary).
          # The proxy's list is of the Caddy binary, built for each platform: each platform's list is signed instead.
          - { image: api, dockerfile: infra/Dockerfile.api, target: runtime, manifest: /workspace/integrity.json, same: true }
          - { image: web, dockerfile: infra/Dockerfile.web, target: runtime, manifest: /workspace/integrity.json, same: true }
          - { image: proxy, dockerfile: infra/Dockerfile.proxy, target: runtime, manifest: /integrity.json, same: false }
          - { image: updater, dockerfile: infra/Dockerfile.updater, target: runtime, manifest: /app/integrity.json, same: true }
    permissions:
      contents: read
      packages: write
      # Signing: the file list and the image get a GitHub build attestation (Sigstore, public log).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version in VERSION (shown as HK-xx.xx.xx): a tag per release, for Settings → Updates to list and roll back to.
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.name.outputs.image }}
          # main / master publish :latest and :<version>, whichever branch is the repository's default.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            HAWK_COMMIT=${{ github.sha }}
            HAWK_REPOSITORY=${{ github.repository }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # The file list each image is checked against: read from each platform's image, compared, then signed.
      - name: The file list, from amd64 and arm64
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MANIFEST: ${{ matrix.manifest }}
          SAME: ${{ matrix.same }}
        run: |
          set -euo pipefail
          # Each platform's own image (by its manifest digest): docker keeps one platform of an index at a time.
          index=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          for arch in amd64 arm64; do
            digest=$(echo "$index" | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            test -n "$digest"
            id=$(docker create --platform "linux/$arch" "$IMAGE@$digest")
            docker cp "$id:$MANIFEST" "integrity-$arch.json"
            docker rm "$id" > /dev/null
          done
          if [ "$SAME" = true ]; then
            cmp integrity-amd64.json integrity-arm64.json
            cp integrity-amd64.json integrity.json
            rm integrity-amd64.json integrity-arm64.json
          fi
          sha256sum integrity*.json
      - name: Sign the file list
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.same && 'integrity.json' || 'integrity-*.json' }}
      - name: Sign the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install syft (checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o syft.tgz https://github.com/anchore/syft/releases/download/v1.32.0/syft_1.32.0_linux_amd64.tar.gz
          echo "d6400b579fa84dd383573b1d1ff6f081a37fc64d3ffaafdfdda95c4325f204be  syft.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf syft.tgz -C "$RUNNER_TEMP/bin" syft && rm syft.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks && rm gitleaks.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The SBOM of what each platform's image ships: its operating-system packages, Python and npm packages and
      # binaries. Packages and versions only (no file contents; SYFT_FILE_METADATA_SELECTION=none: no file list).
      - name: SBOM of the image, for amd64 and arm64
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          KIND: ${{ matrix.image }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_FILE_METADATA_SELECTION: none
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          mkdir -p sbom
          for arch in amd64 arm64; do
            syft scan "registry:$IMAGE@$DIGEST" --platform "linux/$arch" --source-name "hawk-$KIND" --source-version "$version" \
              -o "cyclonedx-json=sbom/hawk-$KIND-$arch.cdx.json"
            test "$(jq -r .bomFormat "sbom/hawk-$KIND-$arch.cdx.json")" = CycloneDX
          done
          ls -l sbom
      - name: The SBOMs carry no secret
        run: gitleaks dir sbom --no-banner --redact --verbose
      # Bound to the multi-platform image's digest, kept next to it in the registry (as the image's signature is).
      - name: Sign the SBOM (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom/hawk-${{ matrix.image }}-amd64.cdx.json
          push-to-registry: true
      - name: Sign the SBOM (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom/hawk-${{ matrix.image }}-arm64.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ matrix.image }}
          path: sbom/
          retention-days: 90

  # A version tag (v*): its GitHub release carries every SBOM (the images' and the dependencies'), next to the images.
  release-sboms:
    needs: [publish, dependency-sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Create the release when the tag has none yet, and attach the files. Nothing else.
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true
      - name: Attach the SBOMs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l sbom
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Hawk AI $TAG. Images: ghcr.io/${GH_REPO,,}-api, -web, -proxy, -updater (signed; SBOMs attached and attested)."
          gh release upload "$TAG" sbom/*.cdx.json --clobber
