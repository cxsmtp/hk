name: Security checks

# Secrets, known-vulnerable dependencies, risky code patterns and known-vulnerable container images. Runs on every pull
# request, on main, and once a week (a dependency or an image can become vulnerable without any change here).
# Hawk AI's own images are scanned as they are built, in release.yml's smoke test (the same grype and .grype.yaml).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: The files this pull request changes carry no secrets
        # The files as they end up, not every commit on the branch: after a squash merge the branch still holds commits
        # that are already on main.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed"
          mkdir -p "$changed"
          git diff -z --name-only --diff-filter=ACMR "$BASE...$HEAD" | while IFS= read -r -d '' f; do
            mkdir -p "$changed/$(dirname "$f")"
            cp "$f" "$changed/$f"
          done
          ./gitleaks dir "$changed" --no-banner --redact --verbose --config .gitleaks.toml
      - name: Whole history (report)
        # Reported, not yet blocking: the history predates this check. Make it blocking once its findings are cleared.
        continue-on-error: true
        run: ./gitleaks git . --no-banner --redact --verbose --config .gitleaks.toml

  python-dependencies:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit==2.10.1
      - name: API dependencies have no known vulnerability
        run: pip-audit -r apps/api/requirements.lock --require-hashes --disable-pip --progress-spinner off

  javascript-dependencies:
    name: JavaScript dependencies (npm audit, shipped packages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [apps/web, extension, packages/hawk-mcp-proxy, packages/hawk-sdk]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.20.2"
      - name: Production dependencies have no high or critical vulnerability
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --audit-level=high

  python-code:
    name: Python code (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install bandit==1.9.4
      - name: No medium or high finding in the API
        # Migrations build DDL from fixed names in the file itself; reviewed by hand instead.
        run: bandit -q -r apps/api/app -ll -ii -x apps/api/app/db/migrations

  container-images:
    name: Container images (grype)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install grype (checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o grype.tgz https://github.com/anchore/grype/releases/download/v0.99.1/grype_0.99.1_linux_amd64.tar.gz
          echo "7fde4d45fe097daa2554078cd9e81faa43e51266a888337f5446c1ffc42d451f  grype.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf grype.tgz -C "$RUNNER_TEMP/bin" grype && rm grype.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: The images Hawk AI runs as they are (PostgreSQL, Redis) have no fixable High or Critical vulnerability
        run: |
          set -euo pipefail
          grype db update
          # Pinned by digest in deploy/compose.yaml (infra/tests/test_deploy_hardening.py checks they are).
          images=$(sed -n 's/^    image: \([a-z0-9.\/-]*:[^@ ]*@sha256:[0-9a-f]\{64\}\)$/\1/p' deploy/compose.yaml)
          test -n "$images"
          status=0
          for image in $images; do
            echo "::group::$image"
            grype "registry:$image" --platform linux/amd64 --config .grype.yaml || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Every pinned base image, all findings (report)
        # Reported, not blocking: the shipped images add the fixes released since (apk upgrade) and are gated as built
        # in release.yml; this list shows when a pinned digest is due to be bumped, including Caddy's own Go modules.
        continue-on-error: true
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/none.yaml"
          images=$(grep -hoE '[a-z0-9./-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' infra/Dockerfile.api infra/Dockerfile.web infra/Dockerfile.proxy infra/Dockerfile.updater deploy/compose.yaml | sort -u)
          for image in $images; do
            echo "::group::$image"
            grype "registry:$image" --platform linux/amd64 --config "$RUNNER_TEMP/none.yaml" --only-fixed || true
            echo "::endgroup::"
          done
