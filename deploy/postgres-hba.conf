# Who may sign in to Hawk AI's PostgreSQL, and how (deploy/compose.yaml mounts this read-only as the hba_file).
# CIS PostgreSQL benchmark: no trust, no md5, no plain-text password; SCRAM-SHA-256 only, and TLS for every network
# connection. PostgreSQL is reachable only on the internal network of deploy/compose.yaml (never published).
#
# TYPE   DATABASE  USER  ADDRESS  METHOD
# The container's own socket (its entrypoint at the first start, pg_isready, an administrator's psql in it).
local    all       all            scram-sha-256
# The other Hawk AI containers (api, worker, beat, migrate), over TLS.
hostssl  all       all   all      scram-sha-256
# Anything else, including any connection without TLS, is refused.
host     all       all   all      reject
