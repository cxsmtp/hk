# Hawk AI on one Linux machine, with one command (/settings/guide/install):
#   sudo deploy/install.sh
# which creates the data folder and its secrets, then runs `docker compose up -d` from this folder.
# The first start prints the administrator's sign-in in the API's log:
#   docker compose logs api
#
# Services: proxy (one HTTPS address), web (console), api, worker and beat (Celery), migrate (once per start),
# postgres and redis; and, when Hawk AI runs the published images (HAWK_RELEASE in .env), the updater that updates and
# rolls back the whole stack from Settings → Updates (/settings/guide/updates). Only the proxy is published: HTTPS on ${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}, and plain http
# on ${HTTP_REDIRECT_PORT:-80} (redirected to https while HTTPS only; Let's Encrypt's checks).
#
# HTTPS (/settings/guide/https): the API owns the certificate and the choices made under Settings → HTTPS and
# writes the proxy's configuration into the hawk-proxy-config volume; the proxy reloads it by itself.
#
# Hardened as CxMissionZero's container and to the CIS Docker Benchmark (section 5, the container runtime): nothing in
# the images can be changed at run time (read_only; only the volumes and a scratch /tmp are writable), no Linux
# capabilities (cap_drop ALL), no privilege escalation (no-new-privileges), a fixed non-root user, a memory cap and a
# CPU weight, at most 512 processes, a health check and a restart policy, 15 s to stop, rotated logs, no privileged
# container and no host namespace. Third-party images (postgres, redis, the proxy's caddy) are pinned by digest.
# Networks: `hawk` (proxy, web, api, worker, beat, migrate) and `hawk-internal` (internal: no way out of this machine)
# for PostgreSQL and Redis, which only api, worker, beat and migrate join; only the proxy publishes a port.
# The exceptions (PostgreSQL's shared memory, the updater's Docker socket) are noted on them.
# infra/tests/test_deploy_hardening.py checks all of this, so it cannot be undone by accident.

name: hawk

# Logs: Docker keeps each container's output in rotated files (5 of 20 MB at most), never filling the disk.
# The API, worker and beat write one JSON object a line (LOG_FORMAT, app/core/log_config.py): docker compose logs api.
x-hawk-logging: &hawk-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hawk-hardening: &hawk-hardening
  restart: unless-stopped
  logging: *hawk-logging
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  stop_grace_period: 15s
  init: true
  user: "1000:1000"
  networks:
    - hawk
  # Memory caps (CIS 5.10) and CPU weight (CIS 5.11; relative, so it never fails on a small machine): each service
  # sets its own below, and HAWK_<SERVICE>_MEMORY in deploy/.env changes one (e.g. HAWK_WORKER_MEMORY=4g). A hard CPU
  # cap is optional (cpus: 2 on a service): it must not exceed this machine's processors, so it is not set here.
  mem_limit: 1g
  cpu_shares: 1024

x-hawk-healthcheck: &hawk-healthcheck
  interval: 30s
  timeout: 5s
  start_period: 20s
  retries: 3

x-hawk-api-image: &hawk-api-image
  image: ${HAWK_API_IMAGE:-hawk-api:local}
  build:
    context: ..
    dockerfile: infra/Dockerfile.api
    target: runtime
    secrets:
      - ca

# Settings for api, worker, beat and migrate. Secrets come from files (Docker secrets, *_FILE), generated by
# install.sh into ${HAWK_DATA_DIR}/secrets and never committed.
x-hawk-environment: &hawk-environment
  ENV: production
  PYTHONPATH: /workspace/apps/api
  # One JSON object a line on stdout, with the request id, tenant and task on each (app/core/log_config.py).
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: ${TZ:-UTC}
  DEMO_MODE: "false"
  PILOT_MODE: "false"
  SELF_REGISTRATION_ENABLED: "false"
  DEPLOYMENT_ID: ${DEPLOYMENT_ID:-hawk}
  DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:-on-premise}
  DEPLOYMENT_DATA_LOCATION: ${DEPLOYMENT_DATA_LOCATION:-on-premise}
  DEPLOYMENT_TOPOLOGY: single_node_compose
  COMPONENT_VERSION: "0.1.0"
  COMPONENT_PROTOCOL_VERSION: "1.0"
  MINIMUM_COMPONENT_VERSIONS_JSON: '{"api":"0.1.0","worker":"0.1.0","celery_beat":"0.1.0","web":"0.1.0"}'
  # The address people use: the console, and the API under /api on the same origin.
  WEB_ORIGIN: ${PUBLIC_URL:-https://${HAWK_HOST:-localhost}:${PORT:-3000}}
  API_BASE_URL: ${PUBLIC_URL:-https://${HAWK_HOST:-localhost}:${PORT:-3000}}/api
  CORS_ORIGINS: ${PUBLIC_URL:-https://${HAWK_HOST:-localhost}:${PORT:-3000}}
  TRUSTED_HOSTS: ${HAWK_HOST:-localhost},localhost,127.0.0.1,api
  MAX_REQUEST_BODY_BYTES: "2097152"
  CONTROL_PLANE_STRICT_DEPENDENCY_CHECKS: "true"
  CONTROL_PLANE_HEARTBEAT_MAX_AGE_SECONDS: "120"
  FAIL_SECURE_MODE: "true"
  GOVERNANCE_STRICT_MODE: "true"
  MCP_PERSISTED_SESSIONS_REQUIRED: "true"
  GATEWAY_INTERCEPT_MINIMAL_MODE: "false"
  ARTIFACT_DIR: /artifacts
  HAWK_DATA_DIR: /data
  # Get help (/settings/guide/self-check-and-help): SUPPORT_MODE=email with SUPPORT_EMAIL opens an email instead of the portal.
  SUPPORT_MODE: ${SUPPORT_MODE:-}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  # A company web proxy (/settings/guide/network). Settings → Network & proxy is the usual place; these are the alternative.
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  SECRET_KEY_LOCK_ENABLED: "true"
  SECRET_KEY_LOCK_FILE: /run/hawk/secret_key.lock
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  CELERY_BROKER_URL_FILE: /run/secrets/celery_broker_url
  CELERY_RESULT_BACKEND_FILE: /run/secrets/celery_result_backend
  SECRET_KEY_FILE: /run/secrets/secret_key
  SECRET_KEY_LOCK_PEPPER_FILE: /run/secrets/secret_key_lock_pepper
  CONNECTOR_SECRETS_KEY_FILE: /run/secrets/connector_secrets_key
  CONNECTOR_SECRETS_KDF_SALT_FILE: /run/secrets/connector_secrets_kdf_salt
  ENFORCEMENT_PAYLOADS_KEY_FILE: /run/secrets/enforcement_payloads_key
  ONPREM_BUNDLE_SIGNING_SECRET_FILE: /run/secrets/onprem_bundle_signing_secret
  # Backups (/settings/guide/backups). Written to BACKUP_DIR on this machine (default ${HAWK_DATA_DIR}/backups),
  # which the containers see as /backups; the newest BACKUP_KEEP kept, one a minute after start, then every
  # BACKUP_INTERVAL_HOURS. Encrypted with BACKUP_PASSPHRASE, else the server's own backup key (Settings → Backups &
  # health); BACKUP_ENCRYPTION=off keeps them plain.
  BACKUP_DIR: /backups
  BACKUP_KEEP: ${BACKUP_KEEP:-14}
  BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
  BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
  BACKUP_ENCRYPTION: ${BACKUP_ENCRYPTION:-}
  # The backup mailbox: every encrypted backup emailed there (up to 15 MB), and a new, empty server restores itself
  # from it (BACKUP_EMAIL_PASSWORD and BACKUP_PASSPHRASE needed).
  BACKUP_EMAIL: ${BACKUP_EMAIL:-}
  BACKUP_EMAIL_PASSWORD: ${BACKUP_EMAIL_PASSWORD:-}
  BACKUP_EMAIL_IMAP_HOST: ${BACKUP_EMAIL_IMAP_HOST:-}
  BACKUP_EMAIL_IMAP_PORT: ${BACKUP_EMAIL_IMAP_PORT:-993}
  BACKUP_EMAIL_USER: ${BACKUP_EMAIL_USER:-}
  # Evidence signing (app/services/evidence_signing.py): local (an Ed25519 key made in the data folder, the default),
  # aws_kms, azure_kv or gcp_kms. Settings → Audit log shows the key; public keys at /.well-known/hawk-evidence-keys.json.
  EVIDENCE_SIGNING_BACKEND: ${EVIDENCE_SIGNING_BACKEND:-local}
  EVIDENCE_SIGNING_AWS_KMS_KEY_ID: ${EVIDENCE_SIGNING_AWS_KMS_KEY_ID:-}
  EVIDENCE_SIGNING_AWS_REGION: ${EVIDENCE_SIGNING_AWS_REGION:-}
  EVIDENCE_SIGNING_AWS_ACCESS_KEY_ID: ${EVIDENCE_SIGNING_AWS_ACCESS_KEY_ID:-}
  EVIDENCE_SIGNING_AWS_SECRET_ACCESS_KEY: ${EVIDENCE_SIGNING_AWS_SECRET_ACCESS_KEY:-}
  EVIDENCE_SIGNING_AZURE_KEY_ID: ${EVIDENCE_SIGNING_AZURE_KEY_ID:-}
  EVIDENCE_SIGNING_AZURE_TENANT_ID: ${EVIDENCE_SIGNING_AZURE_TENANT_ID:-}
  EVIDENCE_SIGNING_AZURE_CLIENT_ID: ${EVIDENCE_SIGNING_AZURE_CLIENT_ID:-}
  EVIDENCE_SIGNING_AZURE_CLIENT_SECRET: ${EVIDENCE_SIGNING_AZURE_CLIENT_SECRET:-}
  EVIDENCE_SIGNING_GCP_KEY_VERSION: ${EVIDENCE_SIGNING_GCP_KEY_VERSION:-}
  EVIDENCE_SIGNING_GCP_CREDENTIALS_JSON: ${EVIDENCE_SIGNING_GCP_CREDENTIALS_JSON:-}
  # At most one "Hawk AI stopped" email to the administrators in this many hours.
  LAST_WORDS_EVERY_HOURS: ${LAST_WORDS_EVERY_HOURS:-6}
  # The mail server that sends them (app/services/mailer.py).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
  SMTP_REQUIRE_AUTH: ${SMTP_REQUIRE_AUTH:-}
  SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-}
  # The licence agreement's parties and forum (TERMS.md): written into the terms shown, accepted and emailed.
  LICENSOR_LEGAL_NAME: ${LICENSOR_LEGAL_NAME:-}
  LICENSOR_ADDRESS: ${LICENSOR_ADDRESS:-}
  LICENSOR_NOTICE_EMAIL: ${LICENSOR_NOTICE_EMAIL:-}
  GOVERNING_LAW: ${GOVERNING_LAW:-}
  DISPUTE_FORUM: ${DISPUTE_FORUM:-}
  LIABILITY_CAP_NO_FEES: ${LIABILITY_CAP_NO_FEES:-}
  # Updates and software integrity (/settings/guide/updates, /settings/guide/updates). Images come from <UPDATE_IMAGE>-api, -web and
  # -proxy; a private copy needs UPDATE_REGISTRY_TOKEN (read-only). The updater shares UPDATER_DIR with api and worker.
  UPDATE_IMAGE: ${UPDATE_IMAGE:-ghcr.io/cxsmtp/hk}
  UPDATE_REGISTRY_TOKEN: ${UPDATE_REGISTRY_TOKEN:-}
  UPDATER_DIR: /updater
  AUTO_UPDATE_EVERY_SECONDS: ${AUTO_UPDATE_EVERY_SECONDS:-900}
  INTEGRITY_CHECK_HOURS: ${INTEGRITY_CHECK_HOURS:-6}
  INTEGRITY_OFFLINE: ${INTEGRITY_OFFLINE:-}
  GITHUB_TOKEN: ${INTEGRITY_GITHUB_TOKEN:-}
  # The self-check and hands-off (/settings/guide/self-check-and-help): how often it checks itself and reads replies, and where its
  # automatic support cases are to be forwarded (by an administrator: Hawk AI never sends outside by itself).
  WATCHDOG_EVERY_SECONDS: ${WATCHDOG_EVERY_SECONDS:-300}
  INBOX_EVERY_SECONDS: ${INBOX_EVERY_SECONDS:-120}
  SELF_RECOVERY_EVERY_SECONDS: ${SELF_RECOVERY_EVERY_SECONDS:-300}
  MAINTAINER_EMAIL: ${MAINTAINER_EMAIL:-}

x-hawk-secrets: &hawk-secrets
  - database_url
  - redis_url
  - celery_broker_url
  - celery_result_backend
  - secret_key
  - secret_key_lock_pepper
  - connector_secrets_key
  - connector_secrets_kdf_salt
  - enforcement_payloads_key
  - onprem_bundle_signing_secret

services:
  proxy:
    <<: *hawk-hardening
    image: ${HAWK_PROXY_IMAGE:-hawk-proxy:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.proxy
      secrets:
        - ca
    # Reachable from this machine only by default. To serve other machines, set BIND_ADDRESS=0.0.0.0 (or one
    # interface's address) and HAWK_HOST to the name or address people use (deploy/.env).
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:8443"
      # Plain http: redirected to https while HTTPS only, Hawk AI itself while http is on next to HTTPS; Let's
      # Encrypt checks the name here (it needs port 80).
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_REDIRECT_PORT:-80}:8080"
    environment:
      HAWK_HOST: ${HAWK_HOST:-localhost}
    volumes:
      - hawk-proxy:/data
      # Written by the API only (app/services/https_proxy.py): the Caddyfile and the certificate in use.
      - hawk-proxy-config:/hawk-proxy:ro
    mem_limit: ${HAWK_PROXY_MEMORY:-512m}
    tmpfs:
      - /tmp
      - /config
    healthcheck:
      <<: *hawk-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "4", "http://127.0.0.1:8081/"]
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

  web:
    <<: *hawk-hardening
    image: ${HAWK_WEB_IMAGE:-hawk-web:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      target: runtime
      secrets:
        - ca
    environment:
      TZ: ${TZ:-UTC}
      COMPONENT_TYPE: web
    mem_limit: ${HAWK_WEB_MEMORY:-1g}
    tmpfs:
      - /tmp
      - /workspace/apps/web/.next/cache:uid=1000,gid=1000
    healthcheck:
      <<: *hawk-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # Before api, worker and beat start (app/cli/prestart.py): applies a restore staged from Settings → Backups &
  # health, lets a new, empty server restore itself from the backup mailbox, then brings the database to this
  # version's schema, and exits; api, worker and beat wait for it.
  migrate:
    <<: [*hawk-hardening, *hawk-api-image]
    restart: "no"
    environment:
      <<: *hawk-environment
      COMPONENT_TYPE: api
    command: ["python", "-m", "app.cli.prestart"]
    # A restore runs here (pg_restore piped into psql), and the backup mailbox is read from here: both networks.
    networks: [hawk, hawk-internal]
    mem_limit: ${HAWK_MIGRATE_MEMORY:-2g}
    secrets: *hawk-secrets
    volumes:
      - hawk-data:/data
      - hawk-runtime:/run/hawk
      - ${BACKUP_DIR:-${HAWK_DATA_DIR}/backups}:/backups
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*hawk-hardening, *hawk-api-image]
    environment:
      <<: *hawk-environment
      COMPONENT_TYPE: api
      # First run (/settings/guide/install): on an empty database the first administrator is made and printed once.
      FIRST_RUN_ACCESS: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}                 # the first administrator's email (default admin@hawk.local)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}           # with ADMIN_EMAIL: their first password (changed at first sign-in)
      FIRST_ADMIN: ${FIRST_ADMIN:-}                 # setup-code: print a setup code instead of a password
      ACCEPT_TERMS: ${ACCEPT_TERMS:-}               # <email>: accept the terms of use for the organisation, on record
      ORGANISATION_NAME: ${ORGANISATION_NAME:-}     # the organisation's name (else given when the terms are accepted)
      # Sign-in (/settings/guide/people-and-access): how long an unused sign-in lasts, and a one-off two-step reset.
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-480}
      RESET_TWO_STEP: ${RESET_TWO_STEP:-}           # <email>: take that person's two-step sign-in off at the next start
      # Single sign-on with OpenID Connect (Settings → Single sign-on shows what is in force).
      COMPANY_SSO_ENABLED: ${COMPANY_SSO_ENABLED:-false}
      OIDC_PROVIDERS_JSON: ${OIDC_PROVIDERS_JSON:-[]}
      OIDC_PROVIDER_SECRETS_JSON: ${OIDC_PROVIDER_SECRETS_JSON:-}
      OIDC_BINDINGS_JSON: ${OIDC_BINDINGS_JSON:-[]}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-}
      OIDC_FRONTEND_URL: ${OIDC_FRONTEND_URL:-}
      # HTTPS (/settings/guide/https). Once changed under Settings → HTTPS, the page's choice wins.
      HTTPS: ${HTTPS:-on}                           # on (HTTPS only), off (plain http) or both
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}             # e.g. /certs/server.crt (the folder ${HAWK_DATA_DIR}/certs)
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}               # e.g. /certs/server.key
      TLS_KEY_PASSPHRASE: ${TLS_KEY_PASSPHRASE:-}
      TLS_PFX_FILE: ${TLS_PFX_FILE:-}               # or one .pfx, e.g. /certs/server.pfx
      TLS_PFX_PASSPHRASE: ${TLS_PFX_PASSPHRASE:-}
      TLS_HOSTNAMES: ${TLS_HOSTNAMES:-}             # extra names for the self-signed certificate
      LETSENCRYPT_DOMAIN: ${LETSENCRYPT_DOMAIN:-}   # a free certificate from Let's Encrypt for this public name
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-}
      LETSENCRYPT_SKIP_CHECK: ${LETSENCRYPT_SKIP_CHECK:-}
      ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}                 # whose X-Forwarded-* to believe, at the proxy
      HAWK_HOST: ${HAWK_HOST:-localhost}
      PUBLIC_URL: ${PUBLIC_URL:-}
      HTTPS_PUBLIC_PORT: ${PORT:-3000}
      HTTP_REDIRECT_PORT: ${HTTP_REDIRECT_PORT:-80}
      HAWK_PROXY_DIR: /hawk-proxy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    networks: [hawk, hawk-internal]
    mem_limit: ${HAWK_API_MEMORY:-2g}
    secrets: *hawk-secrets
    volumes:
      - hawk-data:/data
      - hawk-artifacts:/artifacts
      - hawk-runtime:/run/hawk
      - hawk-proxy-config:/hawk-proxy
      # Certificates given to the deployment (TLS_CERT_FILE…): read-only, from the data folder.
      - ${HAWK_DATA_DIR}/certs:/certs:ro
      - ${BACKUP_DIR:-${HAWK_DATA_DIR}/backups}:/backups
      # Shared with the updater (/settings/guide/updates): requests to it, its heartbeat and status, and this API's ack.
      - ${HAWK_DATA_DIR}/updater:/updater
    healthcheck:
      <<: *hawk-healthcheck
      test: ["CMD", "python", "-m", "app.cli.healthcheck"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: [*hawk-hardening, *hawk-api-image]
    environment:
      <<: *hawk-environment
      COMPONENT_TYPE: worker
    command: ["celery", "-A", "app.jobs.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency", "${CELERY_WORKER_CONCURRENCY:-4}", "--prefetch-multiplier", "1", "-Q", "default,monitoring,auditor,discovery"]
    networks: [hawk, hawk-internal]
    mem_limit: ${HAWK_WORKER_MEMORY:-3g}
    secrets: *hawk-secrets
    volumes:
      - hawk-artifacts:/artifacts
      - hawk-runtime:/run/hawk
      # The scheduled backup runs here (app/jobs/backup_jobs.py): the API's data folder and the backup folder.
      - hawk-data:/data
      - ${BACKUP_DIR:-${HAWK_DATA_DIR}/backups}:/backups
      # Auto-update runs here (app/jobs/update_jobs.py): it writes its request for the updater.
      - ${HAWK_DATA_DIR}/updater:/updater
    healthcheck:
      <<: *hawk-healthcheck
      test: ["CMD", "python", "/workspace/infra/scripts/check_component_heartbeat.py", "worker"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    <<: [*hawk-hardening, *hawk-api-image]
    environment:
      <<: *hawk-environment
      COMPONENT_TYPE: celery_beat
    command: ["celery", "-A", "app.jobs.celery_app.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    networks: [hawk, hawk-internal]
    mem_limit: ${HAWK_BEAT_MEMORY:-512m}
    cpu_shares: 512
    secrets: *hawk-secrets
    volumes:
      - hawk-artifacts:/artifacts
      - hawk-runtime:/run/hawk
      # The proxy and trusted certificates set under Settings → Network & proxy (/settings/guide/network) live here.
      - hawk-data:/data
    healthcheck:
      <<: *hawk-healthcheck
      test: ["CMD", "python", "/workspace/infra/scripts/check_component_heartbeat.py", "celery_beat"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The updater (apps/updater, /settings/guide/updates): CxMissionZero's update companion for the whole stack.
  # Exception (CIS Docker 5.31, "the Docker socket is not mounted inside any container"): it is the only container
  # with the Docker socket, which it needs to replace the other containers. Whoever controls the socket controls this
  # machine, so it is kept apart from everything else:
  #   - no network at all (network_mode: none): nothing can reach it, and it reaches nothing but the socket;
  #   - a fixed non-root user (uid 1000) that may use the socket through the socket's group only (HAWK_DOCKER_GID,
  #     which deploy/install.sh reads from the socket), no capabilities, no privilege escalation, read-only;
  #   - Python's standard library and its own package only, no package manager, signed like the other images;
  #   - it acts only on ${HAWK_DATA_DIR}/updater/request.json, written by the API for an owner or admin: it replaces
  #     migrate, api, worker, beat, web and proxy with the same services on the images asked for (only
  #     <UPDATE_IMAGE>-…, which they must already run), takes a backup first, waits UPDATE_START_TIMEOUT_SECONDS (150)
  #     for them to be healthy, and otherwise puts the previous ones back (and the database, when the migrations ran).
  # Started by install.sh with the published images only (the "updates" profile); HAWK_UPDATER=off leaves it out.
  updater:
    image: ${HAWK_UPDATER_IMAGE:-hawk-updater:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.updater
      target: runtime
    profiles: ["updates"]
    restart: unless-stopped
    logging: *hawk-logging
    user: "1000:1000"
    group_add:
      - "${HAWK_DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: ${HAWK_UPDATER_MEMORY:-256m}
    cpu_shares: 512
    stop_grace_period: 15s
    init: true
    environment:
      TZ: ${TZ:-UTC}
      UPDATER_DIR: /updater
      ENGINE_SOCKET: /var/run/docker.sock
      UPDATE_IMAGE: ${UPDATE_IMAGE:-ghcr.io/cxsmtp/hk}
      UPDATE_REGISTRY_TOKEN: ${UPDATE_REGISTRY_TOKEN:-}
      UPDATE_START_TIMEOUT_SECONDS: ${UPDATE_START_TIMEOUT_SECONDS:-150}
      INTEGRITY_OFFLINE: ${INTEGRITY_OFFLINE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HAWK_DATA_DIR}/updater:/updater
    network_mode: none
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time,datetime as d;b=json.load(open('/updater/updater.json'));raise SystemExit(0 if time.time()-d.datetime.fromisoformat(b['at'].replace('Z','+00:00')).timestamp()<90 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # PostgreSQL, hardened to the CIS Docker and PostgreSQL benchmarks: the image's postgres user (uid 999) from the
  # start, so no capability at all (its entrypoint needs none when it is not root), read-only (the data volume, the
  # socket folder and /tmp are writable), only on the internal network, never published.
  #   - Sign-in: SCRAM-SHA-256 passwords only (password_encryption), and deploy/postgres-hba.conf accepts only
  #     SCRAM-SHA-256 over TLS from the other containers (hostssl; plain TCP is refused) and SCRAM-SHA-256 on the
  #     container's own socket. No trust, no md5.
  #   - TLS (ssl=on, TLS 1.2 at least) with the certificate deploy/install.sh makes for it (postgres_tls.crt and
  #     postgres_tls.key in ${HAWK_DATA_DIR}/secrets). The connection never leaves this machine, so the certificate is
  #     self-signed: the API's libpq encrypts by default (sslmode=prefer) and the server refuses anything else.
  #   - Logging (CIS PostgreSQL section 3): every connection and disconnection, schema changes (log_statement=ddl),
  #     lock waits, errors with their statement and statements slower than 5 s, each line with the time, process,
  #     user, database, client and application: docker compose logs postgres, rotated like the others.
  #   - pgaudit is not in the official image; the connection log and log_statement=ddl stand in for it here.
  # The application connects as the database's owner, `hawk` (the migrations and a few start-up schema checks need
  # it); a separate, least-privileged role for the running services is planned.
  postgres:
    image: postgres:16.16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
    restart: unless-stopped
    logging: *hawk-logging
    user: "999:999"
    command:
      - postgres
      - -c
      - hba_file=/etc/hawk/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/postgres_tls_cert
      - -c
      - ssl_key_file=/run/secrets/postgres_tls_key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d %h %a "
      - -c
      - log_statement=ddl
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=5000
      - -c
      - log_min_error_statement=error
    environment:
      POSTGRES_USER: hawk
      POSTGRES_DB: hawk
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      TZ: ${TZ:-UTC}
    secrets:
      - postgres_password
      - postgres_tls_cert
      - postgres_tls_key
    volumes:
      - hawk-postgres:/var/lib/postgresql/data
      - ./postgres-hba.conf:/etc/hawk/pg_hba.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999,mode=3775
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${HAWK_POSTGRES_MEMORY:-2g}
    cpu_shares: 1024
    # Time for a clean shutdown of the database (CxMissionZero's 15 s is for its own process).
    stop_grace_period: 30s
    shm_size: 128m
    networks:
      - hawk-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawk -d hawk"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  # Redis, hardened to the CIS Docker benchmark and Redis's own security advice: its image's redis user (uid 999),
  # read-only, no capabilities, only on the internal network, never published. A password (requirepass, from
  # ${HAWK_DATA_DIR}/secrets), protected mode on, and the commands Hawk AI never uses that would wipe, reconfigure or
  # walk the whole store switched off (FLUSHALL, FLUSHDB, CONFIG, DEBUG, KEYS; Hawk AI uses SCAN instead).
  redis:
    image: redis:7.4.12@sha256:6b645a37f49b0546582468706b32e71a8b7fbb5ba4583d0f9e27a8004716b738
    restart: unless-stopped
    logging: *hawk-logging
    user: "999:999"
    command:
      - sh
      - -ec
      - >-
        exec redis-server --appendonly yes --appendfsync everysec --protected-mode yes
        --requirepass "$$(cat /run/secrets/redis_password)"
        --rename-command FLUSHALL '' --rename-command FLUSHDB '' --rename-command CONFIG ''
        --rename-command DEBUG '' --rename-command KEYS ''
    secrets:
      - redis_password
    volumes:
      - hawk-redis:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${HAWK_REDIS_MEMORY:-1g}
    cpu_shares: 1024
    stop_grace_period: 15s
    networks:
      - hawk-internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

networks:
  # The proxy, the console and the application: the way out to the internet (email, Let's Encrypt, connectors).
  hawk:
    name: ${HAWK_NETWORK_NAME:-hawk}
  # PostgreSQL and Redis: internal, so they reach nothing outside this machine and nothing outside reaches them;
  # only migrate, api, worker and beat join it.
  hawk-internal:
    name: ${HAWK_INTERNAL_NETWORK_NAME:-hawk-internal}
    internal: true

# State lives in these volumes (and the secrets in ${HAWK_DATA_DIR}/secrets). `docker compose down` keeps them;
# only `docker compose down -v` deletes them.
volumes:
  hawk-postgres:
  hawk-redis:
  hawk-data:          # the API's /data: HTTPS choices and certificates, the backup key (never in a backup), the first
                      # administrator's one-time password file (never in a backup)
  hawk-artifacts:
  hawk-runtime:
  hawk-proxy:         # the proxy's own data folder
  hawk-proxy-config:  # the proxy's configuration and the certificate in use, written by the API (Settings → HTTPS)

secrets:
  # Building behind a company proxy that inspects TLS: its CA certificate (HAWK_BUILD_CA_FILE), else nothing.
  ca:
    file: ${HAWK_BUILD_CA_FILE:-/dev/null}
  postgres_password:
    file: ${HAWK_DATA_DIR:?HAWK_DATA_DIR is required (deploy/install.sh writes it to deploy/.env)}/secrets/postgres_password
  # PostgreSQL's TLS certificate and key (self-signed, made by deploy/install.sh; the key is the postgres user's, 0600).
  postgres_tls_cert:
    file: ${HAWK_DATA_DIR}/secrets/postgres_tls.crt
  postgres_tls_key:
    file: ${HAWK_DATA_DIR}/secrets/postgres_tls.key
  redis_password:
    file: ${HAWK_DATA_DIR}/secrets/redis_password
  database_url:
    file: ${HAWK_DATA_DIR}/secrets/database_url
  redis_url:
    file: ${HAWK_DATA_DIR}/secrets/redis_url
  celery_broker_url:
    file: ${HAWK_DATA_DIR}/secrets/celery_broker_url
  celery_result_backend:
    file: ${HAWK_DATA_DIR}/secrets/celery_result_backend
  secret_key:
    file: ${HAWK_DATA_DIR}/secrets/secret_key
  secret_key_lock_pepper:
    file: ${HAWK_DATA_DIR}/secrets/secret_key_lock_pepper
  connector_secrets_key:
    file: ${HAWK_DATA_DIR}/secrets/connector_secrets_key
  connector_secrets_kdf_salt:
    file: ${HAWK_DATA_DIR}/secrets/connector_secrets_kdf_salt
  enforcement_payloads_key:
    file: ${HAWK_DATA_DIR}/secrets/enforcement_payloads_key
  onprem_bundle_signing_secret:
    file: ${HAWK_DATA_DIR}/secrets/onprem_bundle_signing_secret
