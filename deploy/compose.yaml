# Hawk AI on one Linux machine, with one command (deploy/README.md):
#   sudo deploy/install.sh
# which creates the data folder and its secrets, then runs `docker compose up -d` from this folder.
# The first start prints the administrator's sign-in in the API's log:
#   docker compose logs api
#
# Services: proxy (one HTTPS address), web (console), api, worker and beat (Celery), migrate (once per start),
# postgres and redis. Only the proxy is published: HTTPS on ${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}, and plain http
# on ${HTTP_REDIRECT_PORT:-80} (redirected to https while HTTPS only; Let's Encrypt's checks).
#
# HTTPS (docs/https-and-hosting.md): the API owns the certificate and the choices made under Settings → HTTPS and
# writes the proxy's configuration into the hawk-proxy-config volume; the proxy reloads it by itself.
#
# Hardened as CxMissionZero's container: nothing in the images can be changed at run time (only the volumes and a
# scratch /tmp are writable), no Linux capabilities, no privilege escalation, a non-root user, at most 512 processes,
# 15 s to stop. PostgreSQL and Redis are the exceptions noted on them.

name: hawk

x-hawk-hardening: &hawk-hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  stop_grace_period: 15s
  init: true
  user: "1000:1000"
  networks:
    - hawk
  # Optional limits (CxMissionZero sizes 2 vCPU / 4 GB for its container; Hawk runs several): uncomment to cap.
  # cpus: 2
  # mem_limit: 3g

x-hawk-healthcheck: &hawk-healthcheck
  interval: 30s
  timeout: 5s
  start_period: 20s
  retries: 3

x-hawk-api-image: &hawk-api-image
  image: ${HAWK_API_IMAGE:-hawk-api:local}
  build:
    context: ..
    dockerfile: infra/Dockerfile.api
    target: runtime
    secrets:
      - ca

# Settings for api, worker, beat and migrate. Secrets come from files (Docker secrets, *_FILE), generated by
# install.sh into ${HAWK_DATA_DIR}/secrets and never committed.
x-hawk-environment: &hawk-environment
  ENV: production
  PYTHONPATH: /workspace/apps/api
  TZ: ${TZ:-UTC}
  DEMO_MODE: "false"
  PILOT_MODE: "false"
  SELF_REGISTRATION_ENABLED: "false"
  DEPLOYMENT_ID: ${DEPLOYMENT_ID:-hawk}
  DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:-on-premise}
  DEPLOYMENT_DATA_LOCATION: ${DEPLOYMENT_DATA_LOCATION:-on-premise}
  DEPLOYMENT_TOPOLOGY: single_node_compose
  COMPONENT_VERSION: "0.1.0"
  COMPONENT_PROTOCOL_VERSION: "1.0"
  MINIMUM_COMPONENT_VERSIONS_JSON: '{"api":"0.1.0","worker":"0.1.0","celery_beat":"0.1.0","web":"0.1.0"}'
  # The address people use: the console, and the API under /api on the same origin.
  WEB_ORIGIN: ${PUBLIC_URL:-https://${HAWK_HOST:-localhost}:${PORT:-3000}}
  API_BASE_URL: ${PUBLIC_URL:-https://${HAWK_HOST:-localhost}:${PORT:-3000}}/api
  CORS_ORIGINS: ${PUBLIC_URL:-https://${HAWK_HOST:-localhost}:${PORT:-3000}}
  TRUSTED_HOSTS: ${HAWK_HOST:-localhost},localhost,127.0.0.1,api
  MAX_REQUEST_BODY_BYTES: "2097152"
  CONTROL_PLANE_STRICT_DEPENDENCY_CHECKS: "true"
  CONTROL_PLANE_HEARTBEAT_MAX_AGE_SECONDS: "120"
  FAIL_SECURE_MODE: "true"
  GOVERNANCE_STRICT_MODE: "true"
  MCP_PERSISTED_SESSIONS_REQUIRED: "true"
  GATEWAY_INTERCEPT_MINIMAL_MODE: "false"
  ARTIFACT_DIR: /artifacts
  HAWK_DATA_DIR: /data
  SECRET_KEY_LOCK_ENABLED: "true"
  SECRET_KEY_LOCK_FILE: /run/hawk/secret_key.lock
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  CELERY_BROKER_URL_FILE: /run/secrets/celery_broker_url
  CELERY_RESULT_BACKEND_FILE: /run/secrets/celery_result_backend
  SECRET_KEY_FILE: /run/secrets/secret_key
  SECRET_KEY_LOCK_PEPPER_FILE: /run/secrets/secret_key_lock_pepper
  CONNECTOR_SECRETS_KEY_FILE: /run/secrets/connector_secrets_key
  CONNECTOR_SECRETS_KDF_SALT_FILE: /run/secrets/connector_secrets_kdf_salt
  ENFORCEMENT_PAYLOADS_KEY_FILE: /run/secrets/enforcement_payloads_key
  ONPREM_BUNDLE_SIGNING_SECRET_FILE: /run/secrets/onprem_bundle_signing_secret
  # Backups (deploy/README.md: Backups). Written to BACKUP_DIR on this machine (default ${HAWK_DATA_DIR}/backups),
  # which the containers see as /backups; the newest BACKUP_KEEP kept, one a minute after start, then every
  # BACKUP_INTERVAL_HOURS. Encrypted with BACKUP_PASSPHRASE, else the server's own backup key (Settings → Backups &
  # health); BACKUP_ENCRYPTION=off keeps them plain.
  BACKUP_DIR: /backups
  BACKUP_KEEP: ${BACKUP_KEEP:-14}
  BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
  BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
  BACKUP_ENCRYPTION: ${BACKUP_ENCRYPTION:-}
  # The backup mailbox: every encrypted backup emailed there (up to 15 MB), and a new, empty server restores itself
  # from it (BACKUP_EMAIL_PASSWORD and BACKUP_PASSPHRASE needed).
  BACKUP_EMAIL: ${BACKUP_EMAIL:-}
  BACKUP_EMAIL_PASSWORD: ${BACKUP_EMAIL_PASSWORD:-}
  BACKUP_EMAIL_IMAP_HOST: ${BACKUP_EMAIL_IMAP_HOST:-}
  BACKUP_EMAIL_IMAP_PORT: ${BACKUP_EMAIL_IMAP_PORT:-993}
  BACKUP_EMAIL_USER: ${BACKUP_EMAIL_USER:-}
  # At most one "Hawk AI stopped" email to the administrators in this many hours.
  LAST_WORDS_EVERY_HOURS: ${LAST_WORDS_EVERY_HOURS:-6}
  # The mail server that sends them (app/services/mailer.py).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
  SMTP_REQUIRE_AUTH: ${SMTP_REQUIRE_AUTH:-}
  SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-}

x-hawk-secrets: &hawk-secrets
  - database_url
  - redis_url
  - celery_broker_url
  - celery_result_backend
  - secret_key
  - secret_key_lock_pepper
  - connector_secrets_key
  - connector_secrets_kdf_salt
  - enforcement_payloads_key
  - onprem_bundle_signing_secret

services:
  proxy:
    <<: *hawk-hardening
    image: ${HAWK_PROXY_IMAGE:-hawk-proxy:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.proxy
    # Reachable from this machine only by default. To serve other machines, set BIND_ADDRESS=0.0.0.0 (or one
    # interface's address) and HAWK_HOST to the name or address people use (deploy/.env).
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:8443"
      # Plain http: redirected to https while HTTPS only, Hawk AI itself while http is on next to HTTPS; Let's
      # Encrypt checks the name here (it needs port 80).
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_REDIRECT_PORT:-80}:8080"
    environment:
      HAWK_HOST: ${HAWK_HOST:-localhost}
    volumes:
      - hawk-proxy:/data
      # Written by the API only (app/services/https_proxy.py): the Caddyfile and the certificate in use.
      - hawk-proxy-config:/hawk-proxy:ro
    tmpfs:
      - /tmp
      - /config
    healthcheck:
      <<: *hawk-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "4", "http://127.0.0.1:8081/"]
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

  web:
    <<: *hawk-hardening
    image: ${HAWK_WEB_IMAGE:-hawk-web:local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      target: runtime
      secrets:
        - ca
    environment:
      TZ: ${TZ:-UTC}
      COMPONENT_TYPE: web
    tmpfs:
      - /tmp
      - /workspace/apps/web/.next/cache:uid=1000,gid=1000
    healthcheck:
      <<: *hawk-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # Before api, worker and beat start (app/cli/prestart.py): applies a restore staged from Settings → Backups &
  # health, lets a new, empty server restore itself from the backup mailbox, then brings the database to this
  # version's schema, and exits; api, worker and beat wait for it.
  migrate:
    <<: [*hawk-hardening, *hawk-api-image]
    restart: "no"
    environment:
      <<: *hawk-environment
      COMPONENT_TYPE: api
    command: ["python", "-m", "app.cli.prestart"]
    secrets: *hawk-secrets
    volumes:
      - hawk-data:/data
      - hawk-runtime:/run/hawk
      - ${BACKUP_DIR:-${HAWK_DATA_DIR}/backups}:/backups
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*hawk-hardening, *hawk-api-image]
    environment:
      <<: *hawk-environment
      COMPONENT_TYPE: api
      # First run (deploy/README.md): on an empty database the first administrator is made and printed once.
      FIRST_RUN_ACCESS: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}                 # the first administrator's email (default admin@hawk.local)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}           # with ADMIN_EMAIL: their first password (changed at first sign-in)
      FIRST_ADMIN: ${FIRST_ADMIN:-}                 # setup-code: print a setup code instead of a password
      ACCEPT_TERMS: ${ACCEPT_TERMS:-}               # <email>: accept the terms of use for the organisation, on record
      ORGANISATION_NAME: ${ORGANISATION_NAME:-}     # the organisation's name (else given when the terms are accepted)
      # HTTPS (docs/https-and-hosting.md). Once changed under Settings → HTTPS, the page's choice wins.
      HTTPS: ${HTTPS:-on}                           # on (HTTPS only), off (plain http) or both
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}             # e.g. /certs/server.crt (the folder ${HAWK_DATA_DIR}/certs)
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}               # e.g. /certs/server.key
      TLS_KEY_PASSPHRASE: ${TLS_KEY_PASSPHRASE:-}
      TLS_PFX_FILE: ${TLS_PFX_FILE:-}               # or one .pfx, e.g. /certs/server.pfx
      TLS_PFX_PASSPHRASE: ${TLS_PFX_PASSPHRASE:-}
      TLS_HOSTNAMES: ${TLS_HOSTNAMES:-}             # extra names for the self-signed certificate
      LETSENCRYPT_DOMAIN: ${LETSENCRYPT_DOMAIN:-}   # a free certificate from Let's Encrypt for this public name
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-}
      LETSENCRYPT_SKIP_CHECK: ${LETSENCRYPT_SKIP_CHECK:-}
      ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}                 # whose X-Forwarded-* to believe, at the proxy
      HAWK_HOST: ${HAWK_HOST:-localhost}
      PUBLIC_URL: ${PUBLIC_URL:-}
      HTTPS_PUBLIC_PORT: ${PORT:-3000}
      HTTP_REDIRECT_PORT: ${HTTP_REDIRECT_PORT:-80}
      HAWK_PROXY_DIR: /hawk-proxy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    secrets: *hawk-secrets
    volumes:
      - hawk-data:/data
      - hawk-artifacts:/artifacts
      - hawk-runtime:/run/hawk
      - hawk-proxy-config:/hawk-proxy
      # Certificates given to the deployment (TLS_CERT_FILE…): read-only, from the data folder.
      - ${HAWK_DATA_DIR}/certs:/certs:ro
      - ${BACKUP_DIR:-${HAWK_DATA_DIR}/backups}:/backups
    healthcheck:
      <<: *hawk-healthcheck
      test: ["CMD", "python", "-m", "app.cli.healthcheck"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: [*hawk-hardening, *hawk-api-image]
    environment:
      <<: *hawk-environment
      COMPONENT_TYPE: worker
    command: ["celery", "-A", "app.jobs.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency", "${CELERY_WORKER_CONCURRENCY:-4}", "--prefetch-multiplier", "1", "-Q", "default,monitoring,auditor,discovery"]
    secrets: *hawk-secrets
    volumes:
      - hawk-artifacts:/artifacts
      - hawk-runtime:/run/hawk
      # The scheduled backup runs here (app/jobs/backup_jobs.py): the API's data folder and the backup folder.
      - hawk-data:/data
      - ${BACKUP_DIR:-${HAWK_DATA_DIR}/backups}:/backups
    healthcheck:
      <<: *hawk-healthcheck
      test: ["CMD", "python", "/workspace/infra/scripts/check_component_heartbeat.py", "worker"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    <<: [*hawk-hardening, *hawk-api-image]
    environment:
      <<: *hawk-environment
      COMPONENT_TYPE: celery_beat
    command: ["celery", "-A", "app.jobs.celery_app.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    secrets: *hawk-secrets
    volumes:
      - hawk-artifacts:/artifacts
      - hawk-runtime:/run/hawk
    healthcheck:
      <<: *hawk-healthcheck
      test: ["CMD", "python", "/workspace/infra/scripts/check_component_heartbeat.py", "celery_beat"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Exception: PostgreSQL's entrypoint runs as root to prepare its data folder and then drops to the postgres user,
  # so it keeps the five capabilities that needs (CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE) and a writable root
  # file system. Everything else is as the Hawk containers. Not published; reachable only from the services above.
  # TODO(owner): pin by digest (the repository records no digest for postgres:16).
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hawk
      POSTGRES_DB: hawk
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: ${TZ:-UTC}
    secrets:
      - postgres_password
    volumes:
      - hawk-postgres:/var/lib/postgresql/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Time for a clean shutdown of the database (CxMissionZero's 15 s is for its own process).
    stop_grace_period: 30s
    shm_size: 128m
    networks:
      - hawk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawk -d hawk"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  # Exception: Redis runs as its own user (uid 999, the image's redis user) rather than 1000, so its data volume
  # stays its own. Otherwise hardened as the Hawk containers. Not published.
  # TODO(owner): pin by digest (the repository records no digest for redis:7).
  redis:
    image: redis:7
    restart: unless-stopped
    user: "999:999"
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - hawk-redis:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 15s
    networks:
      - hawk
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

networks:
  hawk:
    name: ${HAWK_NETWORK_NAME:-hawk}

# State lives in these volumes (and the secrets in ${HAWK_DATA_DIR}/secrets). `docker compose down` keeps them;
# only `docker compose down -v` deletes them.
volumes:
  hawk-postgres:
  hawk-redis:
  hawk-data:          # the API's /data: HTTPS choices and certificates, the backup key (never in a backup), the first
                      # administrator's one-time password file (never in a backup)
  hawk-artifacts:
  hawk-runtime:
  hawk-proxy:         # the proxy's own data folder
  hawk-proxy-config:  # the proxy's configuration and the certificate in use, written by the API (Settings → HTTPS)

secrets:
  # Building behind a company proxy that inspects TLS: its CA certificate (HAWK_BUILD_CA_FILE), else nothing.
  ca:
    file: ${HAWK_BUILD_CA_FILE:-/dev/null}
  postgres_password:
    file: ${HAWK_DATA_DIR:?HAWK_DATA_DIR is required (deploy/install.sh writes it to deploy/.env)}/secrets/postgres_password
  redis_password:
    file: ${HAWK_DATA_DIR}/secrets/redis_password
  database_url:
    file: ${HAWK_DATA_DIR}/secrets/database_url
  redis_url:
    file: ${HAWK_DATA_DIR}/secrets/redis_url
  celery_broker_url:
    file: ${HAWK_DATA_DIR}/secrets/celery_broker_url
  celery_result_backend:
    file: ${HAWK_DATA_DIR}/secrets/celery_result_backend
  secret_key:
    file: ${HAWK_DATA_DIR}/secrets/secret_key
  secret_key_lock_pepper:
    file: ${HAWK_DATA_DIR}/secrets/secret_key_lock_pepper
  connector_secrets_key:
    file: ${HAWK_DATA_DIR}/secrets/connector_secrets_key
  connector_secrets_kdf_salt:
    file: ${HAWK_DATA_DIR}/secrets/connector_secrets_kdf_salt
  enforcement_payloads_key:
    file: ${HAWK_DATA_DIR}/secrets/enforcement_payloads_key
  onprem_bundle_signing_secret:
    file: ${HAWK_DATA_DIR}/secrets/onprem_bundle_signing_secret
